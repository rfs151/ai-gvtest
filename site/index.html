<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVTest 架构全景</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="GVTest 自动化测试平台的交互式架构图：模块依赖、中间件和请求数据流。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* 布局：上方标题条 + 左侧架构图（场景条、图、图例）+ 右侧说明/日志面板；窄屏时面板落到图下方 */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --ink: #17201E;
  --muted: #5A6763;
  --line: #C3CCC9;
  --zone-p: #E7ECEA;
  --zone-s: #EEEBE4;
  --node: #FFFFFF;
  --node-s: #FBFAF7;
  --node-b: #A9B5B1;
  --accent: #0E7566;
  --accent-soft: #D7EDE8;
  --p-http: #2160C4;
  --p-sql: #A86A12;
  --p-redis: #C23B35;
  --p-mqtt: #7546C4;
  --p-ssh: #4B5B6B;
  --p-proc: #2A8452;
  --p-ci: #0B8494;
  --ok: #1F8A4C;
  --bad: #C23B35;
  --warn: #A86A12;
  --code-bg: #F5F7F6;
  --font-sans: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Microsoft YaHei", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1514; --surface: #161E1C; --ink: #E3EAE7; --muted: #93A29D; --line: #34433F;
    --zone-p: #151E1C; --zone-s: #1C1A16; --node: #1B2523; --node-s: #211F1A; --node-b: #475752;
    --accent: #45C3AB; --accent-soft: #173A34;
    --p-http: #6FA3F6; --p-sql: #E2AE55; --p-redis: #F0726B; --p-mqtt: #AC8BF2; --p-ssh: #9DAEBF; --p-proc: #5DC58A; --p-ci: #4FC7D5;
    --ok: #5DC58A; --bad: #F0726B; --warn: #E2AE55; --code-bg: #111816;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1514; --surface: #161E1C; --ink: #E3EAE7; --muted: #93A29D; --line: #34433F;
  --zone-p: #151E1C; --zone-s: #1C1A16; --node: #1B2523; --node-s: #211F1A; --node-b: #475752;
  --accent: #45C3AB; --accent-soft: #173A34;
  --p-http: #6FA3F6; --p-sql: #E2AE55; --p-redis: #F0726B; --p-mqtt: #AC8BF2; --p-ssh: #9DAEBF; --p-proc: #5DC58A; --p-ci: #4FC7D5;
  --ok: #5DC58A; --bad: #F0726B; --warn: #E2AE55; --code-bg: #111816;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; margin-bottom: 14px; }
.top h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.top h1 span { color: var(--muted); font-weight: 400; font-size: 15px; margin-left: 10px; }
.top p { margin: 2px 0 0; color: var(--muted); max-width: 64ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 500; font-size: 15px; margin-right: 4px; font-variant-numeric: tabular-nums; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 14px; align-items: start; }
.stage { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.scbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--line); align-items: center; }
.scbar .lbl { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin-right: 2px; }
.sc { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 10px; cursor: pointer; line-height: 1.3; text-align: left; }
.sc small { display: block; font-size: 11px; color: var(--muted); }
.sc:hover { border-color: var(--accent); }
.sc[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.sc.star { border-color: var(--accent); }

.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.ctrl button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.ctrl button:hover:not(:disabled) { border-color: var(--accent); }
.ctrl button:disabled { opacity: .45; cursor: default; }
.ctrl select { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; background: var(--surface); color: var(--ink); }
.ctrl .now { margin-left: auto; color: var(--muted); font-family: var(--font-mono); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctrl .now b { color: var(--ink); font-weight: 500; }

.dgwrap { overflow-x: auto; }
#dg { display: block; width: 100%; min-width: 880px; height: auto; max-height: calc(100vh - 280px); min-height: 520px; user-select: none; }
.zone rect { stroke: none; }
.zone.zp rect { fill: var(--zone-p); }
.zone.zs rect { fill: var(--zone-s); }
.zone text { font-size: 12px; fill: var(--muted); letter-spacing: .08em; font-family: var(--font-sans); }

.edge { fill: none; stroke: var(--line); stroke-width: 1.6; transition: opacity .2s, stroke .2s; }
.edge.ghost { stroke-dasharray: 4 4; }
.edge.hl, .edge.on { stroke: var(--pc); stroke-width: 2.4; }
.edge.on { stroke-dasharray: 7 6; animation: flow .6s linear infinite; }
.edge.on.rev { animation-direction: reverse; }
@keyframes flow { to { stroke-dashoffset: -13; } }
.elabel { font-family: var(--font-mono); font-size: 11px; fill: var(--pc); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; opacity: 0; transition: opacity .2s; pointer-events: none; }
.elabel.show { opacity: 1; }

.node { cursor: pointer; transition: opacity .2s; }
.node rect.box { fill: var(--node); stroke: var(--node-b); stroke-width: 1.2; transition: stroke .2s, stroke-width .2s; }
.node.sut rect.box { fill: var(--node-s); }
.node.ghost rect.box { stroke-dasharray: 5 4; fill: transparent; }
.node .t { font-size: 14px; font-weight: 600; fill: var(--ink); font-family: var(--font-sans); }
.node .s { font-size: 11px; fill: var(--muted); font-family: var(--font-mono); }
.node:hover rect.box, .node.sel rect.box { stroke: var(--accent); stroke-width: 2; }
.node.on rect.box { stroke: var(--accent); stroke-width: 2.2; }
.node .ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; }
.node.pulse .ring { animation: ring 1s ease-out infinite; }
@keyframes ring { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12); } }
.node .ring { transform-box: fill-box; transform-origin: center; }

#dg.focusing .edge:not(.hl) { opacity: .2; }
#dg.focusing .node:not(.hl) { opacity: .45; }
#dg.playing .edge:not(.on) { opacity: .4; }
#dg.playing .node:not(.inv) { opacity: .45; }

.pk circle.core { fill: var(--pc); }
.pk circle.halo { fill: var(--pc); opacity: .22; }
.pk.amb circle.core { opacity: .55; }
.pk .tag rect { fill: var(--surface); stroke: var(--pc); stroke-width: 1; }
.pk .tag text { font-family: var(--font-mono); font-size: 11px; fill: var(--ink); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 12px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; background: var(--pc); display: inline-block; }
.legend .gh i { background: none; border-top: 2px dashed var(--node-b); height: 0; }

/* 协议颜色：同一个 --pc 变量给线、包、徽章用 */
.p-http { --pc: var(--p-http); } .p-sql { --pc: var(--p-sql); } .p-redis { --pc: var(--p-redis); }
.p-mqtt { --pc: var(--p-mqtt); } .p-ssh { --pc: var(--p-ssh); } .p-proc { --pc: var(--p-proc); } .p-ci { --pc: var(--p-ci); }
.p-node { --pc: var(--accent); }

.panel { position: sticky; top: 12px; height: calc(100vh - 24px); max-height: 940px; min-height: 520px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 8px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.tabs .cnt { font-family: var(--font-mono); font-size: 11px; margin-left: 4px; color: var(--muted); }
.tabbody { flex: 1; overflow-y: auto; min-height: 0; }
#tab-info { padding: 16px 18px 22px; }
#tab-log { display: flex; flex-direction: column; overflow: hidden; }
#tab-log > .loghead, #exec { flex: none; }

.info h2 { font-size: 19px; margin: 0; font-weight: 600; }
.info .sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
.info h3 { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 18px 0 6px; }
.info p { margin: 0 0 8px; }
.info ul { margin: 0; padding-left: 18px; }
.info li { margin: 0 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; background: var(--bg); }
.conn { list-style: none; padding: 0 !important; }
.conn li { display: flex; gap: 8px; align-items: baseline; }
.conn button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-align: left; }
.conn button:hover { text-decoration-color: var(--accent); }
.badge { font-family: var(--font-mono); font-size: 10.5px; padding: 0 6px; border-radius: 3px; color: var(--pc); border: 1px solid var(--pc); white-space: nowrap; line-height: 1.6; }
.conn .lab { color: var(--muted); font-size: 12.5px; }
.scl { display: flex; flex-wrap: wrap; gap: 6px; }
.scl button { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 2px 9px; cursor: pointer; font-size: 12.5px; }
.scl button:hover { border-color: var(--accent); }
.how { counter-reset: s; list-style: none; padding: 0 !important; }
.how li { position: relative; padding-left: 26px; }
.how li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11px; display: grid; place-items: center; font-family: var(--font-mono); }

#exec { border-bottom: 1px solid var(--line); padding: 12px 14px; background: var(--bg); }
.cases { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 4px; }
.cases li { display: grid; grid-template-columns: 52px 34px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
.cases .id { font-family: var(--font-mono); }
.cases .ty { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.cases .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st { font-family: var(--font-mono); font-size: 11px; padding: 0 6px; border-radius: 3px; white-space: nowrap; }
.st.queued { color: var(--muted); }
.st.running { color: var(--accent); background: var(--accent-soft); }
.st.passed { color: var(--ok); border: 1px solid var(--ok); }
.st.failed { color: var(--bad); border: 1px solid var(--bad); }
.st.rerun { color: var(--warn); border: 1px solid var(--warn); }
.bw { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); position: relative; }
.bw .bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.bw .dots { display: flex; gap: 4px; } .bw .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.bw .url { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: var(--surface); border-radius: 3px; padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bw .view { padding: 10px 12px; min-height: 132px; font-size: 12px; }
.bw .view h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.bw .fld { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; margin-bottom: 5px; }
.bw .fld label { color: var(--muted); }
.bw .in { border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; min-height: 21px; font-family: var(--font-mono); font-size: 11.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bw .act-on { outline: 2px solid var(--accent); outline-offset: 1px; }
.bw .btn { display: inline-block; margin-top: 4px; padding: 2px 12px; border-radius: 3px; background: var(--accent); color: var(--surface); font-size: 11.5px; }
.bw table { width: 100%; border-collapse: collapse; font-size: 11.5px; font-family: var(--font-mono); }
.bw th, .bw td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.bw th { color: var(--muted); font-weight: 400; }
.bw .blank { color: var(--muted); display: grid; place-items: center; min-height: 112px; font-family: var(--font-mono); }
.bw .act { font-family: var(--font-mono); font-size: 11px; padding: 5px 8px; border-top: 1px solid var(--line); color: var(--accent); background: var(--bg); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bw .flash { position: absolute; inset: 0; background: var(--surface); opacity: 0; pointer-events: none; }
.bw.shot .flash { animation: shot .6s ease-out; }
@keyframes shot { 0% { opacity: .9; } 100% { opacity: 0; } }
.chip-ok { color: var(--ok); }

.loghead { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.loghead b { color: var(--ink); font-weight: 600; font-size: 14px; display: block; }
#log { list-style: none; margin: 0; padding: 6px 0 16px; flex: 1; min-height: 0; overflow-y: auto; }
#log .empty { padding: 28px 18px; color: var(--muted); }
.lg { padding: 9px 14px 10px; border-bottom: 1px solid var(--line); }
.lg:last-child { background: var(--accent-soft); }
.lg-h { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.lg-h .rt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lg-h time { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.lg-t { font-weight: 500; margin-top: 3px; }
.lg-t code { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.lg p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.lg pre { margin: 6px 0 0; padding: 7px 9px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; overflow-x: auto; white-space: pre; max-height: 220px; }
.lg pre .k { color: var(--p-mqtt); } .lg pre .s { color: var(--p-proc); } .lg pre .n { color: var(--p-sql); }

@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; height: 72vh; min-height: 420px; }
}
@media (prefers-reduced-motion: reduce) {
  .edge.on { animation: none; }
  .node.pulse .ring { animation: none; opacity: .6; }
}
</style>
</head>
<body>


<header class="top">
  <div>
    <h1>GVTest 架构全景<span>自动化测试 · 物联网设备模拟 · 数据库 · 通信</span></h1>
    <p>按真实实现画出的模块关系。点任意模块看它做什么、怎么实现；选一个场景，看请求和数据在模块之间怎么流动。</p>
  </div>
  <div class="stats" aria-label="项目规模">
    <span><b>49</b>个页面</span><span><b>32</b>组 API 路由</span><span><b>29</b>个数据模型</span><span><b>7</b>种协议与中间件</span>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-label="架构图">
    <div class="scbar" id="scbar"><span class="lbl">场景</span></div>
    <div class="ctrl">
      <button id="bPlay" type="button" disabled>暂停</button>
      <button id="bStep" type="button" disabled>单步</button>
      <button id="bStop" type="button" disabled>结束</button>
      <label for="speed">速度</label>
      <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="3">3×</option></select>
      <span class="now" id="now">空闲：图上是各连接的日常流量</span>
    </div>
    <div class="dgwrap"><svg id="dg" viewBox="0 34 1300 762" role="img" aria-label="GVTest 架构图"></svg></div>
    <div class="legend" id="legend"></div>
  </section>

  <aside class="panel" aria-label="说明与日志">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="t-info" aria-selected="true" aria-controls="tab-info">模块说明</button>
      <button type="button" role="tab" id="t-log" aria-selected="false" aria-controls="tab-log">请求日志<span class="cnt" id="logCnt"></span></button>
    </div>
    <div class="tabbody" id="tab-info" role="tabpanel"></div>
    <div class="tabbody" id="tab-log" role="tabpanel" hidden>
      <div class="loghead" id="loghead"><b>还没有运行场景</b>在图上方选一个场景开始。</div>
      <div id="exec" hidden></div>
      <ol id="log"><li class="empty">场景运行后，每一次请求、消息和 SQL 都会按顺序出现在这里，并附带数据。</li></ol>
    </div>
  </aside>
</main>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const W = 170, H = 60;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const PROTO = { http: 'HTTP', sql: 'SQL', redis: 'Redis', mqtt: 'MQTT', ssh: 'SSH', proc: '进程内', ci: 'CI' };

/* ---------- 节点 ---------- */
const N = {
  fe:      { x: 130,  y: 110, t: '前端控制台',     s: 'Vue 3 · Vite' },
  jenkins: { x: 620,  y: 110, t: 'Jenkins CI',     s: 'Pipeline · Allure' },
  api:     { x: 130,  y: 270, t: 'FastAPI 后端',   s: '32 组路由 · JWT' },
  sched:   { x: 375,  y: 270, t: '调度器',          s: 'APScheduler · 每分钟' },
  gwsim:   { x: 620,  y: 270, t: 'MQTT 服务群',     s: '网关模拟 · SOC · 监控' },
  redis:   { x: 130,  y: 430, t: 'Redis',           s: 'Dramatiq 队列 · 信号量' },
  mysql:   { x: 375,  y: 430, t: 'MySQL 平台库',    s: '用例 · 任务 · 消息日志' },
  stub:    { x: 620,  y: 430, t: '打桩服务',         s: '规则匹配 · 日前市场桩' },
  worker:  { x: 130,  y: 590, t: 'Dramatiq Worker', s: 'run_tests actor' },
  pytest:  { x: 375,  y: 590, t: 'pytest 执行器',   s: 'fixture · POM · 重跑' },
  browser: { x: 620,  y: 590, t: 'Playwright',      s: 'Chromium · 截图' },
  allure:  { x: 375,  y: 740, t: 'Allure 报告',     s: '结果 · 截图附件' },

/* ---------- 绘制 ---------- */
const svg = $('#dg');
function mk(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function rounded(pts, r = 10) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1);
    const rr = Math.min(r, l1 / 2, l2 / 2);
    d += ` L${x1 - (x1 - x0) / l1 * rr},${y1 - (y1 - y0) / l1 * rr} Q${x1},${y1} ${x1 + (x2 - x1) / l2 * rr},${y1 + (y2 - y1) / l2 * rr}`;
  }
  const L = pts[pts.length - 1];
  return d + ` L${L[0]},${L[1]}`;
}

const gZ = mk('g', {}, svg), gE = mk('g', {}, svg), gN = mk('g', {}, svg), gL = mk('g', {}, svg), gP = mk('g', {}, svg);
[[12, 44, 748, 745, '测试平台 · GVTest', 'zp'], [870, 44, 418, 745, '被测环境 · 业务系统', 'zs']].forEach(([x, y, w, h, t, c]) => {
  const g = mk('g', { class: 'zone ' + c }, gZ);
  mk('rect', { x, y, width: w, height: h, rx: 12 }, g);
  mk('text', { x: x + 16, y: y + 22 }, g).textContent = t;
});

const EM = {};
E.forEach(([a, b, p, label, pts, ghost]) => {
  const id = a + '-' + b;
  const path = mk('path', { d: rounded(pts), class: `edge p-${p}` + (ghost ? ' ghost' : '') }, gE);
  const len = path.getTotalLength();
  const mid = path.getPointAtLength(len / 2);
  const lab = mk('text', { x: mid.x + 6, y: mid.y - 6, class: `elabel p-${p}` }, gL);
  lab.textContent = label;
  EM[id] = { id, a, b, p, label, path, len, lab, ghost: !!ghost };
});

const NM = {};
Object.entries(N).forEach(([id, n]) => {
  const g = mk('g', { class: 'node' + (n.sut ? ' sut' : '') + (n.ghost ? ' ghost' : ''), transform: `translate(${n.x - W / 2},${n.y - H / 2})`, tabindex: 0, role: 'button', 'aria-label': n.t + '，查看说明' }, gN);
  mk('rect', { class: 'ring', width: W, height: H, rx: 8 }, g);
  mk('rect', { class: 'box', width: W, height: H, rx: 8 }, g);
  mk('text', { class: 't', x: 14, y: 26 }, g).textContent = n.t;
  mk('text', { class: 's', x: 14, y: 45 }, g).textContent = n.s;
  g.addEventListener('click', () => showInfo(id, true));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showInfo(id, true); } });
  g.addEventListener('mouseenter', () => focusNode(id));
  g.addEventListener('mouseleave', () => focusNode(null));
  g.addEventListener('focus', () => focusNode(id));
  g.addEventListener('blur', () => focusNode(null));
  NM[id] = g;
});
const edgesOf = id => Object.values(EM).filter(e => e.a === id || e.b === id);

function focusNode(id) {
  if (current) return;
  svg.classList.toggle('focusing', !!id);
  Object.values(EM).forEach(e => { const on = id && (e.a === id || e.b === id); e.path.classList.toggle('hl', !!on); e.lab.classList.toggle('show', !!on); });
  Object.entries(NM).forEach(([k, g]) => g.classList.toggle('hl', !!id && (k === id || edgesOf(id).some(e => e.a === k || e.b === k))));
}

/* 图例 */
$('#legend').innerHTML = Object.entries(PROTO).map(([k, v]) => `<span class="p-${k}"><i></i>${v}</span>`).join('') +
  '<span class="gh"><i></i>生产环境链路（测试中被替代）</span>';

/* ---------- 动画时钟 ---------- */
let sim = 0, last = performance.now(), paused = false, speed = 1;
const packets = new Set();
let waiters = [];
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function frame(ts) {
  const dt = Math.min(64, ts - last); last = ts;
  if (!paused) sim += dt * speed;
  for (const p of packets) {
    let t = p.amb ? (ts - p.start) / p.dur : (sim - p.start) / p.dur;
    if (t >= 1) { p.g.remove(); packets.delete(p); if (p.res) p.res(); continue; }
    t = Math.max(0, t);
    const u = p.amb ? t : ease(t);
    const pt = p.e.path.getPointAtLength((p.d > 0 ? u : 1 - u) * p.e.len);
    p.g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    if (p.g._tag) { const left = pt.x + p.g._tw + 14 > 1295; if (left !== p.g._left) { p.g._left = left; p.g._tag.setAttribute('transform', left ? `translate(${-p.g._tw - 10},-26)` : 'translate(10,-26)'); } }
  }
  waiters = waiters.filter(w => { if (sim >= w.at) { w.res(); return false; } return true; });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const wait = ms => new Promise(res => waiters.push({ at: sim + ms, res }));

function spawn(e, d, tag) {
  const g = mk('g', { class: `pk p-${e.p}` + (tag ? '' : ' amb') }, gP);
  if (tag) {
    mk('circle', { class: 'halo', r: 11 }, g);
    mk('circle', { class: 'core', r: 5.5 }, g);
    const tg = mk('g', { class: 'tag', transform: 'translate(10,-26)' }, g);
    const r = mk('rect', { rx: 4, height: 20 }, tg);
    const tx = mk('text', { x: 7, y: 14 }, tg); tx.textContent = tag;
    const tw = tx.getComputedTextLength() + 14;
    r.setAttribute('width', tw);
    g._tag = tg; g._tw = tw;
  } else {
    mk('circle', { class: 'core', r: 2.6 }, g);
  }
  const p = { e, d, g, amb: !tag };
  if (tag) { p.start = sim; p.dur = 650 + e.len * 0.85; }
  else { p.start = performance.now(); p.dur = e.len * 6 + 400; }
  packets.add(p);
  return new Promise(res => p.res = res);
}

/* 空闲时的日常流量 */
const ambientEdges = Object.values(EM).filter(e => !e.ghost);
setInterval(() => {
  if (current || reduce || document.hidden) return;
  const e = ambientEdges[Math.floor(Math.random() * ambientEdges.length)];
  spawn(e, Math.random() < .65 ? 1 : -1);
}, 260);

/* ---------- 面板 ---------- */
const tabs = { info: [$('#t-info'), $('#tab-info')], log: [$('#t-log'), $('#tab-log')] };
function tab(name) { Object.entries(tabs).forEach(([k, [b, p]]) => { b.setAttribute('aria-selected', k === name); p.hidden = k !== name; }); }
$('#t-info').onclick = () => tab('info');
$('#t-log').onclick = () => tab('log');

function scenesOf(id) { return SC.filter(s => s.steps.some(st => st.n === id || (st.e && (EM[st.e].a === id || EM[st.e].b === id)))); }
function showInfo(id, switchTab) {
  Object.values(NM).forEach(g => g.classList.remove('sel'));
  if (!id) return renderOverview();
  NM[id].classList.add('sel');
  const n = N[id], d = D[id];
  const conns = edgesOf(id).map(e => {
    const other = e.a === id ? e.b : e.a, dir = e.a === id ? '→' : '←';
    return `<li class="p-${e.p}"><span class="badge">${PROTO[e.p]}</span><span>${dir} <button type="button" data-node="${other}">${esc(N[other].t)}</button> <span class="lab">${esc(e.label)}</span></span></li>`;
  }).join('');
  const sc = scenesOf(id).map(s => `<button type="button" data-sc="${s.id}">${esc(s.name)}</button>`).join('');
  $('#tab-info').innerHTML = `<div class="info">
    <h2>${esc(n.t)}</h2><div class="sub">${esc(n.s)}${n.sut ? ' · 被测环境' : ' · 测试平台'}</div>
    <p>${esc(d.role)}</p>
    <h3>技术</h3><div class="chips">${d.tech.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
    <h3>实现要点</h3><ul>${d.pts.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    <h3>连接</h3><ul class="conn">${conns}</ul>
    ${sc ? `<h3>参与的场景</h3><div class="scl">${sc}</div>` : ''}
    <h3></h3><div class="scl"><button type="button" data-back>← 返回总览</button></div>
  </div>`;
  if (switchTab) tab('info');
}
function renderOverview() {
  $('#tab-info').innerHTML = `<div class="info">
    <h2>GVTest 是什么</h2>
    <div class="sub">自动化测试平台 · 能源交易 / 虚拟电厂业务</div>
    <p>为一套能源交易和储能调度系统做的全栈自动化测试平台。测试人员在网页上编写和编排用例，平台用队列把执行交给 Worker，由 pytest 驱动 Playwright 和 httpx 去测业务系统，结果逐条实时回写。</p>
    <p>业务系统要和场站网关、外部交易平台通信，测试环境里没有这些对象，所以平台自己模拟网关（MQTT）、给外部接口打桩（HTTP + SSH 隧道），并能远程查日志、查数据库、改配置。</p>
    <h3>怎么看这张图</h3>
    <ol class="how">
      <li>左边是测试平台，右边是被测环境；虚线框是生产环境里才有、测试时被平台替代的对象。</li>
      <li>鼠标移到模块上，会高亮它的所有连接；点击查看实现说明。</li>
      <li>在图上方选一个场景，请求会一步步沿连线流动，右侧「请求日志」显示每一步的数据。可以暂停、单步、调速度。</li>
    </ol>
    <h3>推荐先看</h3>
    <div class="scl">${SC.slice(0, 3).map(s => `<button type="button" data-sc="${s.id}">${esc(s.name)}</button>`).join('')}</div>
    <h3>技术栈</h3>
    <div class="chips">${['FastAPI', 'Vue 3', 'Dramatiq', 'Redis', 'MySQL', 'pytest', 'Playwright', 'httpx', 'Allure', 'paho-mqtt', 'paramiko', 'APScheduler', 'Nacos', 'InfluxDB', 'Jenkins', 'Docker Compose'].map(t => `<span class="chip">${t}</span>`).join('')}</div>
  </div>`;
}
$('#tab-info').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.node) showInfo(b.dataset.node, true);
  else if (b.dataset.sc) play(SC.find(s => s.id === b.dataset.sc));
  else if ('back' in b.dataset) showInfo(null);
});
renderOverview();

/* ---------- 执行面板（场景「执行业务组」） ---------- */
let ex = null;
function setCase(s, id, st, t) { const c = s.cases.find(c => c.id === id); c.st = st; if (t !== undefined) c.t = t; }
const ST = { queued: '排队', running: '执行中', passed: '通过', failed: '失败', rerun: '重跑' };
function renderExec() {
  const box = $('#exec');
  if (!ex) { box.hidden = true; return; }
  box.hidden = false;
  const b = ex.br, v = b.vals || {};
  const on = k => b.active === k ? ' act-on' : '';
  let view;
  if (b.screen === 'login') view = `<h4>登录</h4>
    <div class="fld"><label>用户名</label><div class="in">${esc(v.user || '')}</div></div>
    <div class="fld"><label>密码</label><div class="in">${esc(v.pw || '')}</div></div>
    <span class="btn${on('login')}">登录</span>`;
  else if (b.screen === 'plan') view = `<h4>新建功率计划</h4>
    <div class="fld"><label>站点</label><div class="in">${esc(v.site || '')}</div></div>
    <div class="fld"><label>类型</label><div class="in">${esc(v.type || '')}</div></div>
    <div class="fld"><label>功率 kW</label><div class="in">${esc(v.power || '')}</div></div>
    <div class="fld"><label>时间窗</label><div class="in">${esc(v.win || '')}</div></div>
    <span class="btn${on('submit')}">提交</span>`;
  else if (b.screen === 'list') view = `<h4>功率计划</h4>
    <table><thead><tr><th>计划号</th><th>站点</th><th>类型</th><th>功率</th><th>状态</th></tr></thead><tbody>
    <tr class="${on('row')}"><td>P-20261103-0007</td><td>1024</td><td>MFRR_UP</td><td>500</td><td class="chip-ok">已下发</td></tr>
    <tr><td>P-20261103-0006</td><td>1024</td><td>FCR_N</td><td>200</td><td>已完成</td></tr></tbody></table>`;
  else view = `<div class="blank">${b.screen === 'blank' ? 'about:blank' : '浏览器未启动'}</div>`;
  box.innerHTML = `<ul class="cases">${ex.cases.map(c => `<li><span class="id">${c.id}</span><span class="ty">${c.ty}</span><span class="nm" title="${esc(c.nm)}">${esc(c.nm)}${c.t ? ` <span class="ty">${esc(c.t)}</span>` : ''}</span><span class="st ${c.st}">${ST[c.st]}</span></li>`).join('')}</ul>
    <div class="bw${ex.shot ? ' shot' : ''}"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">${esc(b.url || '')}</span></div>
    <div class="view">${view}</div><div class="act">${esc(b.act || 'Playwright 动作会显示在这里')}</div><div class="flash"></div></div>`;
  ex.shot = false;
}

/* ---------- 日志 ---------- */
let logN = 0, clock0 = 0, scStart = 0;
const pad = (n, w = 2) => String(n).padStart(w, '0');
function clockStr() {
  const ms = Math.round(clock0 + (sim - scStart));
  const h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
  return `${pad(h)}:${pad(m)}:${pad(s)}.${pad(ms % 1000, 3)}`;
}
function hl(text) {
  return esc(text)
    .replace(/(&quot;[^&\n]*?&quot;)(\s*:)/g, '<span class="k">$1</span>$2')
    .replace(/(:\s*)(&quot;[^\n]*?&quot;)/g, '$1<span class="s">$2</span>')
    .replace(/(:\s*)(-?\d+(?:\.\d+)?)(?=,?$)/gm, '$1<span class="n">$2</span>');
}
function addLog(st) {
  const ol = $('#log');
  if (logN === 0) ol.innerHTML = '';
  logN++;
  $('#logCnt').textContent = logN;
  let route, p;
  if (st.e) { const e = EM[st.e]; const [f, t] = (st.d || 1) > 0 ? [e.a, e.b] : [e.b, e.a]; route = `${N[f].t} → ${N[t].t}`; p = e.p; }
  else { route = N[st.n].t + ' 内部处理'; p = 'node'; }
  const data = st.data === undefined ? '' : (typeof st.data === 'string' ? `<pre>${esc(st.data)}</pre>` : `<pre>${hl(JSON.stringify(st.data, null, 2))}</pre>`);
  const li = document.createElement('li');
  li.className = 'lg';
  li.innerHTML = `<div class="lg-h p-${p}"><span class="badge">${p === 'node' ? '处理' : PROTO[p]}</span><span class="rt">${esc(route)}</span><time>${clockStr()}</time></div>
    <div class="lg-t">${esc(st.title)}${st.tag ? `<code>${esc(st.tag)}</code>` : ''}</div>${st.note ? `<p>${esc(st.note)}</p>` : ''}${data}`;
  ol.appendChild(li);
  ol.scrollTop = ol.scrollHeight;
}

/* ---------- 场景播放 ---------- */
let current = null, token = 0, stepOnce = false, lastEdge = null, lastNode = null;
const scbar = $('#scbar');
SC.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'sc' + (i === 0 ? ' star' : ''); b.dataset.sc = s.id; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `${esc(s.name)}<small>${esc(s.sub)}</small>`;
  b.onclick = () => play(s);
  scbar.appendChild(b);
});
function clearMarks() {
  Object.values(EM).forEach(e => { e.path.classList.remove('on', 'rev', 'hl'); e.lab.classList.remove('show'); });
  Object.values(NM).forEach(g => g.classList.remove('on', 'inv', 'pulse', 'hl'));
  svg.classList.remove('playing', 'focusing');
}
function stop() {
  token++;
  for (const p of packets) { p.g.remove(); }
  packets.clear(); waiters = [];
  clearMarks();
  current = null; paused = false; stepOnce = false; lastEdge = lastNode = null;
  scbar.querySelectorAll('.sc').forEach(b => b.setAttribute('aria-pressed', 'false'));
  updCtrl();
}
function updCtrl(text) {
  $('#bPlay').disabled = $('#bStep').disabled = $('#bStop').disabled = !current;
  $('#bPlay').textContent = paused ? '继续' : '暂停';
  if (text !== undefined) $('#now').innerHTML = text;
  else if (!current) $('#now').textContent = '空闲：图上是各连接的日常流量';
}
async function play(sc) {
  stop();
  const my = token;
  current = sc;
  scbar.querySelector(`[data-sc="${sc.id}"]`).setAttribute('aria-pressed', 'true');
  svg.classList.add('playing');
  const inv = new Set();
  sc.steps.forEach(st => { if (st.n) inv.add(st.n); else { inv.add(EM[st.e].a); inv.add(EM[st.e].b); } });
  inv.forEach(id => NM[id].classList.add('inv'));
  logN = 0; $('#logCnt').textContent = '';
  $('#log').innerHTML = '';
  $('#loghead').innerHTML = `<b>${esc(sc.name)}</b>${esc(sc.desc)}`;
  clock0 = ((sc.base[0] * 60 + sc.base[1]) * 60 + sc.base[2]) * 1000; scStart = sim;
  ex = sc.exec ? { cases: [
      { id: 'TC101', ty: 'UI', nm: '登录并创建 mFRR 功率计划', st: 'queued', t: '' },
      { id: 'TC102', ty: 'API', nm: '查询最新计划并校验字段', st: 'queued', t: '' },
      { id: 'TC103', ty: 'DB', nm: '校验计划已被网关 ACK', st: 'queued', t: '' }],
    br: { screen: 'none', url: '', act: '' }, shot: false } : null;
  renderExec();
  tab('log');
  $('#log').scrollTop = 0;
  updCtrl();
  for (let i = 0; i < sc.steps.length; i++) {
    const st = sc.steps[i];
    updCtrl(`<b>${i + 1}/${sc.steps.length}</b> ${esc(st.title)}`);
    if (lastEdge) lastEdge.path.classList.remove('on', 'rev'), lastEdge.lab.classList.remove('show');
    if (lastNode) lastNode.forEach(id => NM[id].classList.remove('on', 'pulse'));
    if (st.e) {
      const e = EM[st.e], d = st.d || 1;
      e.path.classList.add('on'); e.path.classList.toggle('rev', d < 0); e.lab.classList.add('show');
      NM[e.a].classList.add('on'); NM[e.b].classList.add('on');
      lastEdge = e; lastNode = [e.a, e.b];
      await spawn(e, d, st.tag);
    } else {
      NM[st.n].classList.add('on', 'pulse');
      lastEdge = null; lastNode = [st.n];
      await wait(1000);
    }
    if (my !== token) return;
    addLog(st);
    if (ex && st.ex) { st.ex(ex); renderExec(); }
    if (stepOnce) { paused = true; stepOnce = false; updCtrl(`<b>${i + 1}/${sc.steps.length}</b> ${esc(st.title)}（已暂停）`); }
    await wait(st.n ? 250 : 380);
    if (my !== token) return;
  }
  const name = sc.name;
  clearMarks();
  current = null;
  scbar.querySelectorAll('.sc').forEach(b => b.setAttribute('aria-pressed', 'false'));
  updCtrl(`场景「${esc(name)}」结束，共 ${sc.steps.length} 步`);
}
$('#bPlay').onclick = () => { paused = !paused; stepOnce = false; updCtrl(); };
$('#bStep').onclick = () => { paused = false; stepOnce = true; updCtrl(); };
$('#bStop').onclick = () => { stop(); };
$('#speed').onchange = e => { speed = +e.target.value; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) stop(); });
})();
</script>

</body>
